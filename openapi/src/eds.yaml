openapi: 3.0.0
info:
  title: CCIP Explicit Disclosure API
  description: Provides access to explicit disclosures required to send/execute CCIP messages from/to Canton.
  version: 1.0.0

paths:
  /ccip/v1/message/send:
    post:
      operationId: ccipSend
      description: |
        Get the explicit disclosure for sending a CCIP message to Canton.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CCIPSendRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CCIPSendResponse'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /ccip/v1/message/execute:
    post:
      operationId: ccipExecute
      description: |
        Get the explicit disclosure for executing a CCIP message on Canton.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CCIPExecuteRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CCIPExecuteResponse'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /ccip/v1/perPartyRouter/factory:
    post:
      operationId: perPartyRouterFactory
      description: |
        Get the explicit disclosures for instantiating a PerPartyRouter using the PerPartyRouterFactory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CCIPPerPartyRouterFactoryRequest'
      responses: 
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CCIPPerPartyRouterFactoryResponse'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'

components:
  responses:
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '500':
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CCIPSendRequest:
      type: object
      properties:
        destChain:
          type: integer
    CCIPSendResponse:
      type: object
      properties:
        choiceContext:
          $ref: '#/components/schemas/ChoiceContext'
    CCIPExecuteRequest:
        type: object
        properties:
          sourceChain:
            type: integer
    CCIPExecuteResponse:
      type: object
      properties:
        choiceContext:
          $ref: '#/components/schemas/ChoiceContext'
    CCIPPerPartyRouterFactoryRequest:
      type: object
      properties:
        partyID:
          type: string
      required:
        - partyID
    CCIPPerPartyRouterFactoryResponse:
      type: object
      properties:
        perPartyRouterFactoryId:
          type: string
          description: The Contract ID of the PerPartyRouterFactory
        disclosedContracts:
          description: Disclosures for all contracts required for the caller to instantiate a PerPartyRouter
          type: array
          items:
            $ref: '#/components/schemas/DisclosedContract'
      required:
        - perPartyRouterFactoryId
        - disclosedContracts
    ChoiceContext:
      description: |
        The context required to send/execute a message from/to Canton.
        Used to retrieve additional CCIP contracts which are referred to via their
        contract IDs in the 'choiceContextData'.
      type: object
      properties:
        choiceContextData:
          description: The additional data to use when exercising the choice.
          type: object
        disclosedContracts:
          description: |
              The contracts which are explicitly disclosed as part of the choice context.
              These contracts are required to be disclosed in order to send/execute a message from/to Canton.
          type: array
          items:
            $ref: '#/components/schemas/DisclosedContract'
      required:
        - choiceContextData
        - disclosedContracts
    DisclosedContract:
      type: object
      properties:
        templateId:
          type: string
        contractId:
          type: string
        createdEventBlob:
          type: string
        synchronizerId:
          description: |
            The synchronizer to which the contract is currently assigned.
            If the contract is in the process of being reassigned, then a "409" response is returned.
          type: string
      required:
        - templateId
        - contractId
        - createdEventBlob
        - synchronizerId
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error
