name: Registry Integration Tests
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-check-holdings:
    name: TestCheckHoldings
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: integration-tests/go.mod
          cache-dependency-path: integration-tests/go.sum
      - name: Run Go tests
        run: |
          cd integration-tests/registry
          go test -v -count 1 -timeout 20m -run '^TestCheckHoldings$' ./...
