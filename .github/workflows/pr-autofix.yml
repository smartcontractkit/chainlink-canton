name: Autofix PR
on:
  repository_dispatch:
    types: [ auto-fix-command ] # ChatOps dispatch

env:
  GOLANGCI_LINT_VERSION: v2.11.4

permissions: {}
jobs:
  fix-pr:
    name: Fix PR
    if: github.event.client_payload.slash_command.command == 'auto-fix'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Setup GitHub Token
        id: setup-github-token
        uses: smartcontractkit/.github/actions/setup-github-token@ef78fa97bf3c77de6563db1175422703e9e6674f # setup-github-token@0.2.1
        with:
          aws-role-arn: ${{ secrets.GATI_AWS_ROLE_CANTON_CICD }}
          aws-lambda-url: ${{ secrets.GATI_AWS_LABDA_URL_INTEGRATIONS }}
          aws-region: ${{ secrets.GATI_AWS_REGION }}
      - name: Post comment
        id: post-comment
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc #v2.8.2
        with:
          repo-token: ${{ steps.setup-github-token.outputs.access-token }}
          refresh-message-position: true
          issue: ${{ github.event.client_payload.github.payload.issue.number }}
          message: |
            ⏳ **Autofix is running...**
            Workflow run: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.setup-github-token.outputs.access-token }}
      - name: Remove previous autofix commits
        id: prepare-branch
        run: |
          branch="${{ github.event.client_payload.pull_request.head.ref }}"
          reset_target="HEAD"

          while true; do
            subject="$(git log -1 --format=%s "$reset_target")"
            if [[ ! "$subject" =~ ^\[autofix\]\  ]]; then
              break
            fi

            if ! git rev-parse "${reset_target}^" >/dev/null 2>&1; then
              echo "Branch history is entirely autofix commits; refusing to reset past the root commit."
              exit 1
            fi

            reset_target="${reset_target}^"
          done

          if [[ "$reset_target" != "HEAD" ]]; then
            git reset --hard "$reset_target"
            git push --force-with-lease origin "HEAD:${branch}"
          fi

          git fetch origin "$branch"
          expected_remote_head="$(git rev-parse "origin/${branch}")"
          echo "expected_remote_head=${expected_remote_head}" >> "$GITHUB_OUTPUT"
      - name: merge target branch
        run: |
          echo 'bindings/generated/** merge=ours' >> .git/info/attributes
          echo 'contracts/dars/** merge=ours' >> .git/info/attributes
          git config --global user.name "Login will be determined by the Github API based on the creator of the token"
          git config --global user.email ""
          git config --local merge.ours.driver true
          git fetch origin ${{ github.event.client_payload.pull_request.base.ref }}
          git merge --no-commit "origin/${{ github.event.client_payload.pull_request.base.ref }}"
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          install-only: true
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Install DPM
        uses: ./.github/actions/install-dpm
      - name: Run fixes
        run: make fix-all
      - name: Create commit
        id: commit
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git add -A
            git commit -m "[autofix] apply fix-all to PR"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Verify branch unchanged before signed push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          branch="${{ github.event.client_payload.pull_request.head.ref }}"
          expected_remote_head="${{ steps.prepare-branch.outputs.expected_remote_head }}"

          git fetch origin "$branch"
          current_remote_head="$(git rev-parse "origin/${branch}")"

          if [[ "$current_remote_head" != "$expected_remote_head" ]]; then
            echo "Remote branch changed before push-signed-commits."
            echo "Expected: $expected_remote_head"
            echo "Actual:   $current_remote_head"
            exit 1
          fi
      - name: Push signed commits
        if: steps.commit.outputs.has_changes == 'true'
        # use forked push-signed-commits so that commits can be generated when there are DARs and support chunking
        uses: cfal/push-signed-commits@79a6e400798f7cb290f63bb16854f3f91afc08b4 # v1
        with:
          github-token: ${{ steps.setup-github-token.outputs.access-token }}
          local_branch_name: ${{ github.event.client_payload.pull_request.head.ref }}
          remote_name: "origin"
          remote_branch_name: ${{ github.event.client_payload.pull_request.head.ref }}
      - name: Update comment
        id: update-comment
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc #v2.8.2
        if: always()
        with:
          repo-token: ${{ steps.setup-github-token.outputs.access-token }}
          refresh-message-position: true
          issue: ${{ github.event.client_payload.github.payload.issue.number }}
          message-success: |
            ✅ **Autofix successful**
            Workflow run: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}
          message-failure: |
            ❌ **Autofix failed**
            Workflow run: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}
          message-cancelled: |
            ✖️ **Autofix cancelled**
            Workflow run: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}️
