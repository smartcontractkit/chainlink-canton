name: Integration Tests
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test-coin:
    name: Coin
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run Go tests
        run: |
          cd integration-tests/coin
          go test -v -count 1 ./...

  test-ccip:
    name: CCIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run Go tests
        run: |
          cd integration-tests/ccip
          go test -v -count 1 ./...