name: Test Tailscale Connectivity
run-name: Test Tailscale connectivity to Canton Devnet

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test-tailscale:
    name: Test Tailscale Connectivity
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      id-token: write  
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4.1.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID_CANTON_DEVNET }}
          audience: ${{ secrets.TS_AUDIENCE_CANTON_DEVNET }}
          tags: tag:bcy-validators-gha

      - name: Configure Tailscale for app connector routes
        run: |
          sudo tailscale set --accept-routes=true
          sudo tailscale set --operator=$USER

      - name: "[DEBUG] 1 - Tailscale node info"
        run: |
          echo "=== Tailscale status (this node + peers) ==="
          tailscale status || true
          echo ""
          echo "=== This node's Tailscale IP ==="
          tailscale ip -4 || true
          echo ""
          echo "=== Tailscale debug prefs (confirm AcceptRoutes=true) ==="
          tailscale debug prefs 2>&1 | head -30 || true

      - name: "[DEBUG] 2 - DNS configuration (Split DNS shows app connector DoH)"
        run: |
          echo "=== Tailscale DNS status ==="
          tailscale dns status || true
          echo ""
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf

      - name: "[DEBUG] 3 - DNS resolution (LB IPs returned by app connector DoH)"
        run: |
          echo "=== getent hosts canton-devnet.bcy-v.metalhosts.com ==="
          getent hosts canton-devnet.bcy-v.metalhosts.com || true
      - name: "[DEBUG] 4 - Get route to canton-devnet.bcy-v.metalhosts.com IP"
        run: |
          echo "=== route get 35.182.74.119 ==="
          route get 35.182.74.119 || true

      - name: "[DEBUG] 5 - DNS resolution (LB IPs returned by app connector DoH)"
        run: |
          echo "=== getent hosts canton-devnet.bcy-v.metalhosts.com ==="
          getent hosts canton-devnet.bcy-v.metalhosts.com || true


      - name: "[DEBUG] 6 - Wait 15s for app connector route advertisement"
        run: sleep 15

      - name: "[DEBUG] 7 - Routes (expect LB IPs via tailscale0, but they are MISSING)"
        run: |
          echo "=== All routes via tailscale ==="
          ip route show table all | grep tailscale || echo "(no tailscale routes found)"
          echo ""
          echo "=== Full routing table ==="
          ip route show table all

      - name: "[DEBUG] 8 - Connectivity test (403 = reached ALB via public internet, not via app connector)"
        run: |
          curl -v --connect-timeout 30 -H "Content-Type: application/json" \
            https://canton-devnet.bcy-v.metalhosts.com/metrics/participant 2>&1 || true
