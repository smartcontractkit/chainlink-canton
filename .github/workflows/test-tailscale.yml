name: Test Tailscale Connectivity
run-name: Test Tailscale connectivity to Canton Devnet

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test-tailscale:
    name: Test Tailscale Connectivity
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Required: your Tailscale OIDC subject is repo:...:environment:* so the job must use an environment
    # environment: canton-devnet
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # If you see "sudo failed with exit code 1", the real error is often
      # "requested tags [...] are invalid or not permitted". Create the tag
      # in Tailscale Admin → ACL (Visual) → Tags and set owner to autogroup:admin.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID_CANTON_DEVNET }}
          audience: ${{ secrets.TS_AUDIENCE_CANTON_DEVNET }}
          tags: tag:bcy-validators-gha

      - name: Troubleshoot DNS (Tailscale resolution + 20s sleep)
        run: |
          echo "=== Tailscale DNS status ==="
          sudo tailscale dns status || true
          echo ""
          echo "=== Resolving canton-devnet.bcy-v.metalhosts.com ==="
          tailscale dns resolve canton-devnet.bcy-v.metalhosts.com 2>/dev/null || true
          echo ""
          echo "=== System resolver (getent) ==="
          getent hosts canton-devnet.bcy-v.metalhosts.com || true
          echo ""
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf
          echo ""
          echo "=== Sleeping 20s before curl ==="
          sleep 20

      - name: Test Canton Devnet connectivity
        run: |
          echo "=== tailscale down && tailscale up workaround ==="
          sudo tailscale down && sudo tailscale up
          echo ""
          echo "=== IP that will be used for canton-devnet.bcy-v.metalhosts.com (expect 100.x.x.x for Tailscale) ==="
          getent hosts canton-devnet.bcy-v.metalhosts.com || true
          echo ""
          echo "=== IP route show table all ==="
          ip route show table all || true
          echo ""
          curl -v -H "Content-Type: application/json" https://canton-devnet.bcy-v.metalhosts.com/metrics/participant || true
          echo ""
          echo "✅ If you see 403: request reached AWS (awselb) but was rejected server-side (ELB/WAF/app allowlist or auth)."