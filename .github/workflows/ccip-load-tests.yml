name: CCIP Canton Load Tests

on:
  workflow_dispatch:
    inputs:
      direction:
        description: 'Load test direction'
        required: true
        default: canton2evm
        type: choice
        options:
          - canton2evm
          - evm2canton
          - canton2evm-token
          - evm2canton-token
      message_rate:
        description: 'CANTON_LOAD_MESSAGE_RATE (e.g. 1/1s, 1/20s)'
        required: false
        default: '1/1s'
        type: string
      load_duration:
        description: 'CANTON_LOAD_DURATION (Go duration, e.g. 90s, 10m)'
        required: false
        default: '90s'
        type: string
      test_timeout:
        description: 'go test -timeout value (must exceed load duration + teardown)'
        required: false
        default: '40m'
        type: string
      canton_ref:
        description: 'chainlink-canton git ref (empty = workflow ref)'
        required: false
        default: ''
        type: string

concurrency:
  group: ccip-load-${{ github.actor }}
  cancel-in-progress: false

jobs:
  load:
    permissions:
      id-token: write
      contents: read
    name: CCIP load (${{ inputs.direction }})
    runs-on: ubuntu-latest-8cores-32GB
    timeout-minutes: 120
    steps:
      - name: Check out workflow ref
        uses: actions/checkout@v6

      - name: Setup CCIP devenv
        uses: ./.github/actions/setup-ccip-devenv
        with:
          canton-ref: ${{ inputs.canton_ref }}
          ccv-iam-role: ${{ secrets.CCV_IAM_ROLE }}
          jd-registry: ${{ secrets.JD_REGISTRY }}
          jd-image: ${{ secrets.JD_IMAGE }}

      - name: Run load tests
        working-directory: chainlink-canton/ccip/devenv/tests/load
        env:
          CANTON_LOAD_MESSAGE_RATE: ${{ inputs.message_rate }}
          CANTON_LOAD_DURATION: ${{ inputs.load_duration }}
        run: |
          case "${{ inputs.direction }}" in
            canton2evm) TEST_RUN='^TestCanton2EVM_Load$' ;;
            evm2canton) TEST_RUN='^TestEVM2Canton_Load$' ;;
            canton2evm-token) TEST_RUN='^TestCanton2EVM_TokenLoad$' ;;
            evm2canton-token) TEST_RUN='^TestEVM2Canton_TokenLoad$' ;;
            *) echo "unknown direction: ${{ inputs.direction }}" >&2; exit 1 ;;
          esac
          go test -timeout ${{ inputs.test_timeout }} -v -count 1 -run "$TEST_RUN"

      - name: Upload devenv logs
        if: always()
        uses: ./chainlink-canton/.github/actions/upload-ccip-devenv-logs
        with:
          test-package-dir: load
          log-dump-suffix: ccip-load-tests
          artifact-name: container-logs-ccip-load-tests
