name: Release Please

on:
  push:
    branches: [ main ]

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      # contracts
      contracts--tag_name: ${{ steps.release.outputs.contracts--tag_name }}
      contracts--major: ${{ steps.release.outputs.contracts--major }}
      contracts--minor: ${{ steps.release.outputs.contracts--minor }}
      contracts--patch: ${{ steps.release.outputs.contracts--patch }}
    steps:
      - name: Setup GitHub Token
        id: setup-github-token
        uses: smartcontractkit/.github/actions/setup-github-token@ef78fa97bf3c77de6563db1175422703e9e6674f # setup-github-token@0.2.1
        with:
          aws-role-arn: ${{ secrets.GATI_AWS_ROLE_CANTON_CICD }}
          aws-lambda-url: ${{ secrets.GATI_AWS_LABDA_URL_INTEGRATIONS }}
          aws-region: ${{ secrets.GATI_AWS_REGION }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.setup-github-token.outputs.access-token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes the Dar release artifacts to a drafted release and marks the release as released.
  dar-artifacts:
    needs: release-please
    if: needs.release-please.outputs.releases_created && contains(needs.release-please.outputs.paths_released, 'contracts')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Setup GitHub Token
        id: setup-github-token
        uses: smartcontractkit/.github/actions/setup-github-token@ef78fa97bf3c77de6563db1175422703e9e6674f # setup-github-token@0.2.1
        with:
          aws-role-arn: ${{ secrets.GATI_AWS_ROLE_CANTON_CICD }}
          aws-lambda-url: ${{ secrets.GATI_AWS_LABDA_URL_INTEGRATIONS }}
          aws-region: ${{ secrets.GATI_AWS_REGION }}
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Create contract artifacts
        working-directory: contracts
        run: |
          echo "Building Dar artifacts for ${{ needs.release-please.outputs.contracts--tag_name }}"
          zip -9 -r -j chainlink-ccip-v${{ needs.release-please.outputs.contracts--major }}.${{ needs.release-please.outputs.contracts--minor }}.${{ needs.release-please.outputs.contracts--patch }}.zip ./dars/released
      - name: Add artifacts to release
        working-directory: contracts
        env:
          GH_TOKEN: ${{ steps.setup-github-token.outputs.access-token }}
        run: |
          gh release upload ${{ needs.release-please.outputs.contracts--tag_name }} chainlink-ccip-v${{ needs.release-please.outputs.contracts--major }}.${{ needs.release-please.outputs.contracts--minor }}.${{ needs.release-please.outputs.contracts--patch }}.zip
      - name: Mark release as released
        env:
          GH_TOKEN: ${{ steps.setup-github-token.outputs.access-token }}
        run: |
          gh release edit ${{ needs.release-please.outputs.contracts--tag_name }} --draft=false
