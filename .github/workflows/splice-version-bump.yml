name: Splice version bump

on:
  schedule:
    # Nightly at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: splice-version-bump
  cancel-in-progress: false

env:
  SPLICE_REPO: canton-network/splice
  BRANCH: chore/bump-splice-version

jobs:
  bump:
    name: Check for new Splice version
    runs-on: ubuntu-latest
    steps:
      - name: Setup GitHub Token
        id: setup-github-token
        uses: smartcontractkit/.github/actions/setup-github-token@ef78fa97bf3c77de6563db1175422703e9e6674f # setup-github-token@0.2.1
        with:
          aws-role-arn: ${{ secrets.GATI_AWS_ROLE_CANTON_CICD }}
          aws-lambda-url: ${{ secrets.GATI_AWS_LABDA_URL_INTEGRATIONS }}
          aws-region: ${{ secrets.GATI_AWS_REGION }}

      - name: Check out code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.setup-github-token.outputs.access-token }}

      - name: Get latest Splice version
        id: latest
        run: |
          LATEST="$(gh api "repos/${SPLICE_REPO}/tags?per_page=100" --jq '.[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)"
          if [ -z "${LATEST}" ]; then
            echo "No version tags found in ${SPLICE_REPO}"
            exit 1
          fi
          echo "Latest Splice version: ${LATEST}"
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get current Splice version
        id: current
        run: |
          CURRENT="$(sed -n 's/^SPLICE_VERSION=//p' .SPLICE-VERSION | tr -d '"')"
          echo "Current Splice version: ${CURRENT}"
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          if [ "${CURRENT}" = "${LATEST}" ]; then
            echo "Already on the latest Splice version (${CURRENT})"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HIGHEST="$(printf '%s\n%s\n' "${CURRENT}" "${LATEST}" | sort -V | tail -n 1)"
          if [ "${HIGHEST}" != "${LATEST}" ]; then
            echo "Latest tag (${LATEST}) is not newer than the current version (${CURRENT})"
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Splice ${LATEST} is newer than ${CURRENT}"
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing bump PR
        if: steps.compare.outputs.update == 'true'
        id: pr
        run: |
          PR_NUMBER="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // ""')"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare branch
        if: steps.compare.outputs.update == 'true'
        run: |
          if [ -n "${{ steps.pr.outputs.number }}" ]; then
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
          elif git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null; then
            echo "Remote branch ${BRANCH} exists without an open PR, reusing it"
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
          else
            # Create the remote branch at the current default branch head. That commit is
            # already verified, so this passes the repo's signed-commit policy; the version
            # bump itself is pushed as a signed commit below.
            git push origin "HEAD:refs/heads/${BRANCH}"
            git checkout -b "${BRANCH}"
          fi

      - name: Update .SPLICE-VERSION
        if: steps.compare.outputs.update == 'true'
        run: |
          sed -i "s/^SPLICE_VERSION=.*/SPLICE_VERSION=${{ steps.latest.outputs.version }}/" .SPLICE-VERSION
          cat .SPLICE-VERSION

      - name: Commit bump
        if: steps.compare.outputs.update == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .SPLICE-VERSION; then
            echo "Branch is already on Splice ${{ steps.latest.outputs.version }}"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add .SPLICE-VERSION
          git commit -m "build: bump Splice to ${{ steps.latest.outputs.version }}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push signed commits
        # The repo enforces signed commits; this recreates the local commit on the remote
        # via createCommitOnBranch, which signs it with the GATI app identity.
        if: steps.compare.outputs.update == 'true' && steps.commit.outputs.has_changes == 'true'
        uses: cfal/push-signed-commits@79a6e400798f7cb290f63bb16854f3f91afc08b4 # v1
        with:
          github-token: ${{ steps.setup-github-token.outputs.access-token }}
          local_branch_name: ${{ env.BRANCH }}
          remote_name: "origin"
          remote_branch_name: ${{ env.BRANCH }}

      - name: Create or update PR
        if: steps.compare.outputs.update == 'true' && steps.commit.outputs.has_changes == 'true'
        run: |
          LATEST="${{ steps.latest.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          TITLE="build: bump Splice to ${LATEST}"
          BODY_FILE="$(mktemp)"
          cat > "${BODY_FILE}" <<EOF
          Bumps the Splice version from ${CURRENT} to ${LATEST}.

          .SPLICE-VERSION is the single source of truth for the Splice version and is
          consumed by both the Go code (splice.go) and the Docker Compose localnet setup.

          Tags: https://github.com/${SPLICE_REPO}/tags

          > [!NOTE]
          > This PR is updated automatically by the Splice version bump workflow whenever a newer Splice version is released.
          EOF
          if [ -n "${{ steps.pr.outputs.number }}" ]; then
            gh pr edit "${{ steps.pr.outputs.number }}" --title "${TITLE}" --body-file "${BODY_FILE}"
            echo "Updated existing PR #${{ steps.pr.outputs.number }}"
          else
            gh pr create --head "${BRANCH}" --title "${TITLE}" --body-file "${BODY_FILE}"
            echo "Created new PR bumping Splice to ${LATEST}"
          fi
          rm -f "${BODY_FILE}"
        env:
          # Use the GATI token so the PR is not attributed to github-actions[bot],
          # which would prevent other workflows from running on the PR.
          GH_TOKEN: ${{ steps.setup-github-token.outputs.access-token }}
