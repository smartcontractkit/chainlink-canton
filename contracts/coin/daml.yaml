# Test/demo coin package used by Daml Script and local integration flows.
# This package is not the production token implementation for CCIP.
#
# For config file options, refer to:
# https://docs.daml.com/tools/assistant.html#project-config-file-daml-yaml

sdk-version: 3.4.11
name: coin
source: daml
init-script: Main:setup
version: 0.0.1
build-options:
  - "-Wno-crypto-text-is-alpha"
  - "-Wno-template-interface-depends-on-daml-script"
  - "-Werror=unused-dependency"
data-dependencies:
  - ../dependencies/splice/splice-api-token-metadata-v1-1.0.0.dar
  - ../dependencies/splice/splice-api-token-holding-v1-1.0.0.dar
  - ../dependencies/splice/splice-api-token-burn-mint-v1-1.0.0.dar
  - ../dependencies/splice/splice-api-token-transfer-instruction-v1-1.0.0.dar
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
