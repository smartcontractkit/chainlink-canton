sdk-version: 3.4.11
name: ccip-registry-rate-limiter-v2
source: daml
version: 2.0.0
# Fresh lineage, uniform with the registry pools: its only consumers are the
# registry pools, which redeploy at 2.0.0, so the 1.0.x upgrade path is retired.
build-options:
  - "-Wno-crypto-text-is-alpha"
  - "-Werror=unused-dependency"
data-dependencies:
  - ../../../mcms/api/.daml/dist/mcms-api-1.0.0.dar
  - ../../../chainlink/api/.daml/dist/chainlink-api-2.0.0.dar
dependencies:
  - daml-prim
  - daml-stdlib
