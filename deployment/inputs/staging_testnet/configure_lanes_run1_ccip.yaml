# Run 1 — CCIP core lane configure (Sepolia + Canton in one input).
# Pipeline: configure-chains-for-lanes-from-topology (generic v2)
#
# - Sepolia: full lane configure incl. CommitteeVerifier toward Canton
# - Canton: CCIP core only — omit committeeverifiers (CV skipped in proposal mode; Run 2)
# - One merged MCMS proposal (EVM + Canton) with qualifier CLLCCIP (staging_testnet MCMS ref)
#
# Prerequisites: Sepolia + Canton CCIP contracts deployed; address_refs in datastore;
# topology.toml has canton + evm signers for cross-family lanes.
#
# Copy to deployments repo, e.g.:
#   domains/ccv/staging_testnet/durable_pipelines/inputs/configure_lanes_run1_ccip.yaml
#
# Run (from chainlink-deployments-staging-testnet-canton-init/domains/ccv/cmd):
#   export ONCHAIN_CANTON_JWT_TOKEN="<staging canton JWT>"
#   go run . durable-pipeline run -e staging_testnet \
#     -i configure_lanes_run1_ccip.yaml \
#     -c configure-chains-for-lanes-from-topology
#
# Requires read_as_party_ids for ccipOwner on canton-testnet in testnet.yaml.
#
# Before run: set mcms.validUntil to unix timestamp > now + 10m.

environment: staging_testnet
domain: ccv
changesets:
  - configure-chains-for-lanes-from-topology:
      chainOverrides:
        - 10109143320554840099 # Canton testnet
        - 16015286601757825753 # Sepolia
      payload:
        chains:
          - chainselector: 10109143320554840099 # Canton testnet (local)
            # NO committeeverifiers — CV configure is Run 2 (mcms-ccv)
            remotechains:
              16015286601757825753: # Sepolia (remote)
                defaultinboundccvs:
                  - qualifier: default
                    type: CommitteeVerifier
                    version: "0.1.0"
                defaultoutboundccvs:
                  - qualifier: default
                    type: CommitteeVerifier
                    version: "0.1.0"
                feequoterdestchainconfig:
                  linkfeemultiplierpercent: 100
                  usdperunitgas: 38
          - chainselector: 16015286601757825753 # Sepolia (local)
            committeeverifiers:
              - committeequalifier: default
                remotechains:
                  10109143320554840099: {} # Canton testnet (remote)
            remotechains:
              10109143320554840099: # Canton testnet (remote)
                feequoterdestchainconfig:
                  linkfeemultiplierpercent: 100
                  usdperunitgas: 38
        mcms:
          description: "Run 1 — Configure Canton ↔ Sepolia CCIP lanes (CCIP core)"
          qualifier: CLLCCIP
          overridePreviousRoot: true
          validUntil: 1893456000
          timelockDelay: 1s
          timelockAction: schedule
