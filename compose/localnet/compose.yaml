---

volumes:
  postgres:

services:
  postgres:
    image: "postgres:14"
    container_name: postgres
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d
      #- postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INIT_DATABASES=${POSTGRES_INIT_DATABASES}
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER} -d postgres"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    user: "postgres"
    ports:
      - 5432:5432
    command:
      - postgres
      - -c
      - max_connections=1000

  canton:
    image: "ghcr.io/digital-asset/decentralized-canton-sync/docker/canton:${SPLICE_VERSION}"
    container_name: canton
    volumes:
      - ./docker/canton/health-check.sh:/app/health-check.sh
      - ./config/canton/app.conf:/app/app.conf
    env_file:
      - ./env/common.env
    environment:
      - DB_SERVER=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "bash", "/app/health-check.sh"]
      interval: 20s
      start_interval: 5s
      timeout: 30s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    ports:
      # Participant 0 (SV)
      - 1200:1200  # Admin API
      - 1300:1300  # Ledger API
      # Participant 1
      - 1201:1201  # Admin API
      - 1301:1301  # Ledger API
      # Participant 2
      - 1202:1202  # Admin API
      - 1302:1302  # Ledger API
      # Participant 3
      - 1203:1203  # Admin API
      - 1303:1303  # Ledger API
      # Participant 4
      - 1204:1204  # Admin API
      - 1304:1304  # Ledger API
      # Participant 5
      - 1205:1205  # Admin API
      - 1305:1305  # Ledger API

  splice:
    image: "ghcr.io/digital-asset/decentralized-canton-sync/docker/splice-app:${SPLICE_VERSION}"
    container_name: splice
    env_file:
      - ./env/common.env
    volumes:
      - ./docker/splice/health-check.sh:/app/health-check.sh
      - ./config/splice/app.conf:/app/app.conf
    environment:
      - DB_SERVER=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_AUDIENCE=https://canton.network.global
      - SPLICE_APP_VALIDATOR_AUTH_AUDIENCE=https://canton.network.global
    healthcheck:
      test: ["CMD", "bash", "/app/health-check.sh"]
      interval: 20s
      start_interval: 5s
      timeout: 40s
      retries: 1000
      start_period: 30s
    depends_on:
      canton:
        condition: service_healthy
    restart: always
    ports:
      - 5012:5012  # Scan registry
      # Validator Admin APIs
      - 2200:2200  # SV
      - 2201:2201  # Participant 1
      - 2202:2202  # Participant 2
      - 2203:2203  # Participant 3
      - 2204:2204  # Participant 4
      - 2205:2205  # Participant 5

  nginx:
    image: "nginx:1.27.0"
    container_name: nginx
    env_file:
      - ./env/common.env
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/templates:/etc/nginx/templates
      - ./config/nginx/includes:/etc/nginx/includes
    ports:
      - 8080:8080
    depends_on:
      splice:
        condition: service_healthy
    restart: always

  console:
    build:
      context: ./docker/console
      args:
        BASE_IMAGE: ghcr.io/digital-asset/decentralized-canton-sync/docker/canton:${SPLICE_VERSION}
    env_file:
      - ./env/common.env
    environment:
      - DB_SERVER=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./docker/console/entrypoint.sh:/app/entrypoint.sh
      - ./config/console/app.conf:/app/app.conf
    entrypoint: /app/entrypoint.sh
    stdin_open: true
    tty: true
    profiles:
      - console
