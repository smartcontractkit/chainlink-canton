        }
    }

    # Participant 5
    validator-apps.participant5-validator_backend = ${_validator_backend} {
        onboarding.secret = ${PARTICIPANT5_VALIDATOR_ONBOARDING_SECRET}
        validator-party-hint = "participant5-localparty-1"
        domain-migration-dump-path = "/domain-upgrade-dump/domain_migration_dump-participant5.json"
        storage.config.properties.databaseName = validator-participant5
        admin-api.port = ${SPLICE_VALIDATOR_ADMIN_API_PORT_PREFIX}05
        participant-client {
