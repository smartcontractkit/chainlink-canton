                auth-config = {
                    type = "self-signed"
                    user = ${API_USER_NAME}
                    audience = ${API_AUDIENCE}
                    secret = "unsafe"
                }
            }
        }
        auth = {
            algorithm = "hs-256-unsafe"
            audience = ${API_AUDIENCE}
            secret = "unsafe"
        }
        ledger-api-user = ${API_USER_NAME}
        validator-wallet-users.0="participant2"

        domains.global.buy-extra-traffic {
