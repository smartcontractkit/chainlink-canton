_storage {
  type = postgres
  config {
     dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
     properties = {
       serverName = ${?DB_SERVER}
       portNumber = 5432
       databaseName = validator
       currentSchema = validator
       user =  ${?DB_USER}
       password = ${?DB_PASSWORD}
       tcpKeepAlive = true
     }
   }
   parameters {
     max-connections = 32
     migrate-and-start = true
   }
 }

_validator_backend {
  latest-packages-only = true
  domain-migration-id = 0
  storage = ${_storage}
  admin-api = {
    address = "0.0.0.0"
    port = 5003
  }
  participant-client = {
    admin-api = {
      address = canton
      port = 5002
    }
    ledger-api.client-config = {
      address = canton
      port = 5001
    }
  }
  scan-client {
    type = "bft"
    seed-urls = []
    seed-urls.0 = "http://localhost:5012"
  }

  app-instances {
  }
  onboarding.sv-client.admin-api.url = "http://localhost:5014"
  domains.global.alias = "global"
  contact-point = "contact@local.host"
  canton-identifier-config.participant = participant
}

canton.features.enable-testing-commands = yes

# SV
_sv_participant_client = {
  admin-api {
    address = canton
    port = ${CANTON_PARTICIPANT_ADMIN_API_PORT_PREFIX}00
  }
  ledger-api {
    client-config {
      address = canton
      port = ${CANTON_PARTICIPANT_LEDGER_API_PORT_PREFIX}00
    }
    auth-config {
        type = "self-signed"
        user = ${API_USER_NAME}
        audience = ${API_AUDIENCE}
        secret = "unsafe"
    }
  }
}

_splice-instance-names {
  network-name = "Splice"
  network-favicon-url = "https://www.hyperledger.org/hubfs/hyperledgerfavicon.png"
  amulet-name = "Amulet"
  amulet-name-acronym = "AMT"
  name-service-name = "Amulet Name Service"
  name-service-name-acronym = "ANS"
}

canton {
    # SV
    validator-apps.sv-validator_backend = ${_validator_backend} {
        canton-identifier-config.participant = sv
        onboarding = null
        scan-client = null
        scan-client = {
            type = "trust-single"
            url="http://localhost:5012"
        }
        sv-user=${API_USER_NAME}
        sv-validator=true
        storage.config.properties.databaseName = validator-sv
        admin-api.port = ${SPLICE_VALIDATOR_ADMIN_API_PORT_PREFIX}00
        participant-client = ${_sv_participant_client}
        auth = {
            algorithm = "hs-256-unsafe"
            audience = ${API_AUDIENCE}
            secret = "unsafe"
        }
        ledger-api-user = ${API_USER_NAME}
        validator-wallet-users.0 = "sv"
    }

    # Participant 1
    validator-apps.participant1-validator_backend = ${_validator_backend} {
        onboarding.secret = ${PARTICIPANT1_VALIDATOR_ONBOARDING_SECRET}
        validator-party-hint = "participant1-localparty-1"
        domain-migration-dump-path = "/domain-upgrade-dump/domain_migration_dump-participant1.json"
        storage.config.properties.databaseName = validator-participant1
        admin-api.port = ${SPLICE_VALIDATOR_ADMIN_API_PORT_PREFIX}01
        participant-client {
            admin-api.port = ${CANTON_PARTICIPANT_ADMIN_API_PORT_PREFIX}01

            ledger-api = {
                client-config.port = ${CANTON_PARTICIPANT_LEDGER_API_PORT_PREFIX}01
                auth-config = {
                    type = "self-signed"
                    user = ${API_USER_NAME}
                    audience = ${API_AUDIENCE}
                    secret = "unsafe"
                }
            }
        }
        auth = {
            algorithm = "hs-256-unsafe"
            audience = ${API_AUDIENCE}
            secret = "unsafe"
        }
        ledger-api-user = ${API_USER_NAME}
        validator-wallet-users.0="participant1"

        domains.global.buy-extra-traffic {
            min-topup-interval = "1m"
            target-throughput = "20000"
        }
    }

    # Participant 2
    validator-apps.participant2-validator_backend = ${_validator_backend} {
        onboarding.secret = ${PARTICIPANT2_VALIDATOR_ONBOARDING_SECRET}
