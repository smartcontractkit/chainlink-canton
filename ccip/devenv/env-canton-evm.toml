####################
# Canton Verifiers #
####################

## Default Verifier Setup
[[verifier]]
  image = "verifier:latest"
  # Will get prefixed appropriately by the modifier.
  container_name = "default-verifier-1"
  nop_alias = "canton-default-verifier-1"
  port = 8100
  # path is relative from "devenv" dir
  committee_name = "default"
  node_index = 0
  disable_finality_checkers = ["8706591216959472610"] # Disable finality detection on Canton.
  chain_family = "canton"
  [verifier.db]
    image = "postgres:16-alpine"
    name = "default-verifier-1-db"
    port = 8432
  [verifier.opaque_configs.canton]
    [verifier.opaque_configs.canton.reader_configs.8706591216959472610]
      ccip_owner_party = "participant1-localparty-1"
      [verifier.opaque_configs.canton.reader_configs.8706591216959472610.ccip_message_sent_template_id]
        package_id = "#ccip-common"
        module_name = "CCIP.Events"
        entity_name = "CCIPMessageSent"
      [verifier.opaque_configs.canton.reader_configs.8706591216959472610.rmn_remote_template_id]
        package_id = "#ccip-rmn"
        module_name = "CCIP.RMNRemote"
        entity_name = "RMNRemote"
    [verifier.opaque_configs.canton.blockchain_infos.8706591216959472610]
      # These will be filled in by the modifier, which hydrates the config with
      # the full URLs and JWT token.
      grpc_ledger_api_url = "TODO:fillin"
      [verifier.opaque_configs.canton.blockchain_infos.8706591216959472610.auth]
        type = "insecureStatic"
        jwt = "TODO:fillin"


[[verifier]]
  image = "verifier:latest"
  # Will get prefixed appropriately by the modifier.
  container_name = "default-verifier-2"
  nop_alias = "canton-default-verifier-2"
  port = 8200
  committee_name = "default"
  node_index = 1
  disable_finality_checkers = ["8706591216959472610"] # Disable finality detection on Canton.
  chain_family = "canton"
  [verifier.db]
