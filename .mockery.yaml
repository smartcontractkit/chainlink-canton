dir: ./internal/mocks
pkgname: mocks
template: testify
formatter: goimports
formatter-options:
  goimports:
    local-prefix: github.com/smartcontractkit/chainlink-canton

include-auto-generated: true

packages:
  github.com/digital-asset/dazl-client/v8/go/api/com/daml/ledger/api/v2:
    interfaces:
      StateServiceClient:
        config:
          filename: "mock_StateServiceClient.go"
      UpdateServiceClient:
        config:
          filename: "mock_UpdateServiceClient.go"
  google.golang.org/grpc:
    interfaces:
      ServerStreamingClient:
        config:
          filename: "mock_ServerStreamingClient.go"

  github.com/smartcontractkit/chainlink-canton/eds/internal/store:
    interfaces:
      ActiveContractStoreInterface:
        config:
          dir: ./eds/internal/mocks/
          structname: MockActiveContractStore
          filename: "mock_ActiveContractStore.go"
      InstrumentHoldingStoreInterface:
        config:
          dir: ./eds/internal/mocks/
          structname: MockInstrumentHoldingStore
          filename: "mock_InstrumentHoldingStore.go"

  github.com/smartcontractkit/chainlink-canton/eds/internal/api/global:
    interfaces:
      InstanceAddressFilter:
        config:
          dir: ./eds/internal/mocks/
          structname: MockInstanceAddressFilter
          filename: "mock_InstanceAddressFilter.go"